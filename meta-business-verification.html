<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet">
  <title>业务主体信息</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: #182235;
      background: #f4f6f9;
    }

    * { box-sizing: border-box; }
    body { margin: 0; }
    main {
      max-width: 760px;
      margin: 48px auto;
      padding: 0 24px;
    }
    article {
      padding: 40px;
      border: 1px solid #e5e9f0;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 18px 45px rgba(33, 48, 74, .08);
    }
    h1 { margin: 0 0 10px; font-size: 30px; }
    .note { margin: 0 0 30px; color: #6c788b; line-height: 1.7; }
    dl {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 18px 24px;
      margin: 0;
    }
    dt { color: #6c788b; }
    dd { margin: 0; line-height: 1.7; }
    footer {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid #e8ebf0;
      color: #7a879a;
      font-size: 14px;
      line-height: 1.7;
    }
    @media (max-width: 640px) {
      main { margin: 20px auto; padding: 0 14px; }
      article { padding: 28px 22px; }
      dl { grid-template-columns: 1fr; gap: 6px; }
      dd { margin-bottom: 12px; }
    }
  </style>
</head>
<body>
  <main>
    <article>
      <h1>业务主体信息</h1>
      <p class="note">本页面用于平台业务主体核验，不作为产品功能页面或公开推广入口。</p>

      <dl>
        <dt>公司名称</dt>
        <dd>上海传英信息技术有限公司</dd>

        <dt>注册地址</dt>
        <dd>中国（上海）自由贸易试验区学林路36弄1号楼1层</dd>

        <dt>联系电话</dt>
        <dd>+86 21 6042 8051</dd>

        <dt>相关服务</dt>
        <dd>本地热点机会中心（TrendOS Local Hotspot Center）</dd>
      </dl>

      <footer>
        本页面不展示统一社会信用代码、银行账户或其他非必要信息。
      </footer>
    </article>
  </main>
</body>
</html>
