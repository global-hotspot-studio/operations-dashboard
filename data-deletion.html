  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#182235;background:#f4f6f9}*{box-sizing:border-box}body{margin:0}.shell{max-width:760px;margin:48px auto;padding:0 24px}.card{background:#fff;border:1px solid #e5e9f0;border-radius:22px;padding:40px;box-shadow:0 18px 45px rgba(33,48,74,.08)}h1{margin:0 0 8px;font-size:32px}h2{margin:30px 0 10px;font-size:19px}p,li{color:#526076;line-height:1.8}small{color:#7a879a}a{color:#0b72e7}.back{display:inline-block;margin-top:28px;text-decoration:none}@media(max-width:640px){.shell{margin:20px auto;padding:0 14px}.card{padding:26px 22px}}

<body>
  <main class="shell">
    <article class="card">
      <h1>用户数据删除说明</h1>
      <small>本地热点机会中心 · 更新于 2026 年 7 月 31 日</small>
      <h2>如何提交删除请求</h2>
      <ol>
        <li>打开项目维护方的 <a href="https://github.com/global-hotspot-studio/operations-dashboard/issues">GitHub 支持入口</a>；</li>
        <li>标题填写“数据删除请求”；</li>
        <li>提供相关 Facebook/Instagram 公开内容链接、Page 或账号名称，以及需要删除的原因；</li>
        <li>不要在公开工单中提交密码、访问令牌、证件号码或其他敏感信息。</li>
      </ol>
      <h2>处理范围</h2>
      <p>收到可验证的请求后，我们会从当前看板数据、后续抓取候选池和受控归档中移除相关记录，并在合理时间内回复处理状态。源平台上的原始内容需要由内容发布者或对应平台处理。</p>
      <a class="back" href="./index.html">← 返回本地热点机会中心</a>
    </article>
  </main>
